version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Neon-compatible)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sangam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sangam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sangam"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Python Intelligence & Matching Service (FastAPI)
  # ----------------------------------------------------------------------------
  intelligence:
    build:
      context: ./intelligence
      dockerfile: Dockerfile
    container_name: sangam-intelligence
    restart: unless-stopped
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # Express.js Backend API
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sangam-server
    restart: unless-stopped
    environment:
      - PORT=4000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/sangam?schema=public
      - JWT_SECRET=super-secure-sangam-jwt-secret-replace-in-production
      - CORS_ORIGIN=http://localhost:5173
      - INTELLIGENCE_SERVICE_URL=http://intelligence:8000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      intelligence:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # React Client (Vite + Tailwind)
  # ----------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sangam-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000/api/v1
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
